services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: business_brain
      POSTGRES_USER: business_brain
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_brain -d business_brain"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:

